; Desktop 6-DOF Arm - PlatformIO project
;
; Every bring-up step is its own firmware "app" with its own environment.
; Flash exactly one at a time, in order, and do not move on until it passes.
;
;   pio run -e vref_setup -t upload   ; static pins for Vref measurement
;   pio run -e i2c_scan -t upload     ; then: pio device monitor
;   pio run -e encoder_test -t upload
;   pio run -e motor_test -t upload
;   pio run -e phase1_bench -t upload
;   pio run -e calibration -t upload
;   pio run -e closed_loop -t upload
;   pio run -e coordinated -t upload
;
; Host-side math tests (no hardware needed):
;   pio test -e native_tests

[platformio]
; Open-loop bring-up: Uno + TMC2209 + NEMA 17 only, no I2C hardware attached.
default_envs = motor_test

; ---------------------------------------------------------------------------
; Shared Arduino Uno settings. Environments pull these in with `extends`.
; ---------------------------------------------------------------------------
[uno_base]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_flags = -Wall
; Apps are mutually exclusive: start from nothing, add one file per env.
build_src_filter = -<*>

; --- 00: prove the I2C bus, the mux, and the encoder are alive ---------------
[env:i2c_scan]
extends = uno_base
build_src_filter = -<*> +<apps/app_00_i2c_scan.cpp>

; --- 01: read joint angle by hand, check magnet alignment -------------------
[env:encoder_test]
extends = uno_base
build_src_filter = -<*> +<apps/app_01_encoder_test.cpp>

; --- 02: open-loop motor only, used while setting TMC2209 current ----------
[env:vref_setup]
extends = uno_base
build_src_filter = -<*> +<apps/app_02_vref_setup.cpp>

[env:motor_test]
extends = uno_base
build_src_filter = -<*> +<apps/app_02_motor_test.cpp>

; --- 03: Phase 1 deliverable: motor + encoder CSV stream -------------------
[env:phase1_bench]
extends = uno_base
build_src_filter = -<*> +<apps/app_03_phase1_bench.cpp>

; --- 04: measure steps/degree, direction sign, and backlash ----------------
[env:calibration]
extends = uno_base
build_src_filter = -<*> +<apps/app_04_calibration.cpp>

; --- 05: closed-loop PID position control with a serial CLI ----------------
[env:closed_loop]
extends = uno_base
build_src_filter = -<*> +<apps/app_05_closed_loop.cpp>

; --- 06: three joints via the JointNode contract that later moves to CAN ---
[env:multi_joint]
extends = uno_base
build_src_filter = -<*> +<apps/app_06_multi_joint.cpp>

; --- 07: synchronized multi-joint trajectories + gripper (D7 layers 1 and 0) -
[env:coordinated]
extends = uno_base
build_src_filter = -<*> +<apps/app_07_coordinated.cpp>
lib_deps = arduino-libraries/Servo@^1.2.2

; --- 08: no CLI. The arm as a device on a framed binary link to the host. ---
; monitor_speed is raised to match LINK_BAUD; this port streams packets, not
; text, so a serial monitor will show garbage. Use tools/pick_place.py.
[env:host_link]
extends = uno_base
build_src_filter = -<*> +<apps/app_08_host_link.cpp>
lib_deps = arduino-libraries/Servo@^1.2.2
monitor_speed = 500000

; --- 09: pull-out / step-rate characterization, one motor, no reducer ------
; Reports the ACTUAL issued step rate next to the commanded one, so an MCU
; loop-rate limit cannot be mistaken for a skipped step.
[env:pullout]
extends = uno_base
build_src_filter = -<*> +<apps/app_09_pullout.cpp>

; ---------------------------------------------------------------------------
; Unit tests for hardware-independent math.
; native_tests runs on your PC and needs a host g++ on PATH (MinGW-w64 on
; Windows). If you do not have one, uno_tests runs the same tests on the board.
; ---------------------------------------------------------------------------
[env:native_tests]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Ilib/ArmMath -Ilib/JointNode -Ilib/Motion
build_src_filter = -<*>

[env:uno_tests]
extends = uno_base
test_framework = unity
build_src_filter = -<*>
